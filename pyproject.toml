[project]
name = "seedling"
version = "0.1.0"
description = "Train models on pooled, unreliable hardware by sharing only seeds and scores."
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "UmamAlamin" }]
keywords = ["evolution strategies", "distributed training", "pytorch", "llm", "reproducibility"]
classifiers = [
    "Programming Language :: Python :: 3.13",
    "Programming Language :: C",
    "Operating System :: POSIX :: Linux",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=2.1",
    "torch>=2.14",
]

[project.optional-dependencies]
llm = [
    "transformers>=4.50",
    "safetensors>=0.4",
    "pyarrow>=15",
]
rl = [
    "gymnasium[mujoco]>=1.0",
]

[dependency-groups]
dev = [
    "seedling[llm,rl]",
    "pytest>=8.3",
    "matplotlib>=3.9",
    "xxhash>=4.0.1",
]

[project.urls]
Repository = "https://github.com/4arkeinlvy/seedling"

[project.scripts]
seedling = "seedling.cli:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["seedling*"]

[tool.setuptools.package-data]
seedling = ["py.typed", "assets/*.txt"]

[tool.uv]
# NixOS: uv's own Python runs through nix-ld and can load pip wheels such as torch.
# The nixpkgs Python cannot, so never pick it.
python-preference = "only-managed"

[tool.uv.sources]
torch = [{ index = "pytorch-cu130" }]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra -m 'not heavy and not llm'"
markers = [
    "heavy: child processes import torch (~1 GB extra RAM). Run with: uv run pytest -m heavy",
    "llm: downloads and runs Qwen2.5-0.5B-Instruct on the GPU. Run with: uv run pytest -m llm",
]
